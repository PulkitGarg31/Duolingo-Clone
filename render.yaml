# Render blueprint for the FastAPI backend (the Next.js frontend is deployed on Vercel).
# The SQLite file lives on Render's ephemeral disk: it is created and seeded on every boot.
services:
  - type: web
    name: owlingo-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: CORS_ORIGINS
        sync: false # https://<your-project>.vercel.app
      - key: CORS_ORIGIN_REGEX
        sync: false # optional, e.g. ^https://<your-project>-[a-z0-9-]+\.vercel\.app$ for preview deploys
      - key: DEFAULT_USERNAME
        value: alex
      - key: ALLOW_USER_HEADER
        value: "false"
      - key: ENABLE_DEV_TOOLS
        value: "true"
      - key: SEED_TIMEZONE
        value: Asia/Kolkata
      - key: HEART_REGEN_MINUTES
        value: "300"
      - key: LOG_LEVEL
        value: info
